name: Verify live Pages preview
on:
  push:
    branches: [main]
    paths:
      [
        "index.html",
        "pages-assets/**",
        "_config.yml",
        ".github/workflows/pages-smoke.yml",
      ]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
permissions:
  contents: read
jobs:
  check-live-page:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed homepage and assets
        shell: bash
        run: |
          set -euo pipefail
          site="https://plummz.github.io/HIGPrintingServices"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 "$site/?revision=${{ github.sha }}" -o /tmp/home.html && grep -q 'motion.js?v=motion-1' /tmp/home.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 10
          done
          curl --fail --silent --show-error --max-time 20 "$site/pages-assets/style.css?v=motion-1" -o /tmp/style.css
          curl --fail --silent --show-error --max-time 20 "$site/pages-assets/app.js?v=motion-1" -o /tmp/app.js
          curl --fail --silent --show-error --max-time 20 "$site/pages-assets/motion.js?v=motion-1" -o /tmp/motion.js
          grep -q 'PrintFlowMotion' /tmp/motion.js
          grep -q 'paper-feed' /tmp/style.css
          grep -q 'service-grid' /tmp/style.css
          grep -q 'printflow-pages-preview-v1' /tmp/app.js
          echo "Live PrintFlow homepage, workspace preview, CSS and JavaScript verified."
