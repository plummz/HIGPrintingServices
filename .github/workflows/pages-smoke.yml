name: Verify live Pages preview
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
permissions:
  contents: read
jobs:
  check-live-page:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed homepage and assets
        shell: bash
        run: |
          set -euo pipefail
          site="https://plummz.github.io/HIGPrintingServices"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 "$site/?revision=${{ github.event.workflow_run.head_sha }}" -o /tmp/home.html && grep -q 'id="workspace-view"' /tmp/home.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 10
          done
          curl --fail --silent --show-error --max-time 20 "$site/pages-assets/style.css" -o /tmp/style.css
          curl --fail --silent --show-error --max-time 20 "$site/pages-assets/app.js" -o /tmp/app.js
          grep -q 'service-grid' /tmp/style.css
          grep -q 'printflow-pages-preview-v1' /tmp/app.js
          echo "Live PrintFlow homepage, workspace preview, CSS and JavaScript verified."
